<div class="min-h-screen bg-slate-50 flex flex-col font-sans">

  <!-- Header Bar -->
<app-header></app-header>

  <!-- Main Body Content -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-xl bg-white rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50 p-6 sm:p-8 space-y-6">

      <div class="text-center space-y-1">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 m-0">Upload Your Room Photo</h2>
        <p class="text-xs sm:text-sm text-slate-500 m-0">Select a clear, well-lit image of your wall to start previewing colors</p>
      </div>

      
      <div
        (click)="fileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.border-blue-500]="isDragging()"
        [class.bg-blue-50]="isDragging()"
        class="border-2 border-dashed border-slate-300 hover:border-blue-500 hover:bg-blue-50/50 transition-all rounded-xl p-6 sm:p-8 text-center cursor-pointer relative flex flex-col items-center justify-center gap-3 bg-slate-50/50"
      >
        <input
          #fileInput
          type="file"
          accept="image/png,image/jpeg,image/jpg"
          (change)="onFileSelected($event)"
          class="hidden"
        />

        @if (previewUrl()) {
          <div class="relative w-full max-h-64 rounded-lg overflow-hidden border border-slate-200 shadow-sm">
            <img [src]="previewUrl()" alt="Selected room preview" class="w-full h-full object-contain bg-slate-100" />
            <span class="absolute top-2 right-2 px-2.5 py-1 bg-black/60 text-white text-xs rounded-full backdrop-blur-sm">Click to change</span>
          </div>
        } @else {
          <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-slate-700 m-0">Click to upload or drag & drop</p>
            <p class="text-xs text-slate-400 m-0 mt-1">Supports PNG, JPG, JPEG (Max 10MB)</p>
          </div>
        }
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="p-3 rounded-lg bg-red-50 border border-red-200 flex items-center gap-2 text-red-600 text-xs sm:text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Submit Button -->
      <button
        (click)="onUpload()"
        [disabled]="!selectedFile() || uploading()"
        class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl transition-all shadow-md shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer"
      >
        @if (uploading()) {
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Processing Image...</span>
        } @else {
          <span>Upload & Open Visualizer Studio →</span>
        }
      </button>

    </div>
  </main>

</div>
