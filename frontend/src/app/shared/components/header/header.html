<header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
        🎨
      </div>
      <h1 class="text-base sm:text-lg font-bold text-slate-800 m-0 tracking-tight hidden sm:block">
        Smart Wall Paint Visualizer
      </h1>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <a routerLink="/saved-designs" class="px-3.5 py-1.5 text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition">
        Saved Designs
      </a>

      @if (isAdmin()) {
        <a routerLink="/admin" class="px-3.5 py-1.5 text-xs sm:text-sm font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition">
          Admin Panel
        </a>
      }

      <!-- page-specific extra buttons (e.g. Save Project) go here -->
      <ng-content></ng-content>

      <button (click)="onLogout()" class="px-3.5 py-1.5 text-xs sm:text-sm font-medium text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 transition cursor-pointer">
        Logout
      </button>
    </div>
  </div>
</header>
